version: 2
project_name: peekaping
changelog:
  disable: true
builds:
  - id: peekaping
    main: ./cmd/peekaping-pp-cli
    binary: peekaping
    env:
      - CGO_ENABLED=0
    ldflags:
      # Module path is peekaping-pp-cli; the version var lives in its internal/cli package.
      - -s -w -X peekaping-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: peekaping-pp-mcp
    main: ./cmd/peekaping-pp-mcp
    binary: peekaping-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  # Uses the GitHub repo resolved from the git origin remote.
  draft: false
  prerelease: auto
